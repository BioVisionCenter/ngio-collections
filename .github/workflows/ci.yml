name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: dev
      - name: Lint
        run: pixi run -e dev lint
      - name: Format check
        run: pixi run -e dev ruff format --check .
      - name: Type check
        run: pixi run -e dev type-check
      - name: Tests
        run: pixi run -e dev pytest
