[project]
authors = [{ name = "lorenzo", email = "lorenzo.cerrone@uzh.ch" }]
dependencies = ["pydantic>=2.0.0,<3.0.0"]
name = "ngio-collections"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
fsspec = ["fsspec"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ngio_collections"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
ngio_collections = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.1"
pytest = ">=8"
pytest-asyncio = ">=0.24"
ty = "*"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format = "ruff format ."
pytest = "pytest"
type-check = "ty check"

[tool.pixi.feature.test.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.24"

[tool.pixi.environments]
dev = ["dev"]
test = ["test"]

[tool.pixi.feature.test.tasks]
pytest = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".pixi/envs/dev"

[tool.ty.src]
# Tests freely subscript JsonValue-typed JSON test data; only the package
# itself is held to ty's standards.
include = ["src"]
